name: CI/CD

on: [push, pull_request]

# Every arch builds through the SAME CMake authority now — the legacy i386 Makefile
# and the MSVC .vcxproj/.sln are gone. CMake carries the i386 toolchain (classic
# -m32 -mfpmath=387 flags), the aarch64 cross toolchain, the MSVC config, and the
# Emscripten side-module setup. 64-bit targets static-link openvgui (+ the vgui_support
# shim, both git submodules) so the client exports InitVGUISupportAPI and carries no
# vgui/SDL2 dependency; 32-bit (i386/win32) keeps dynamic Valve vgui. Input on every
# target is fed by the engine's push callbacks (no SDL2 anywhere).

jobs:
  # Linux i386 — CMake + the in-tree i386 toolchain. 32-bit keeps dynamic Valve vgui.
  linux-i386:
    name: Linux-i386
    runs-on: ubuntu-latest
    # Build inside the goldsrc-net build image (debian10 / glibc-2.28 floor, gcc-multilib +
    # aarch64 cross + cmake 3.29) so the .so runs on any glibc >= 2.28 — Ubuntu runners link
    # 2.34+. Published by goldsrc-net/build-containers (its 64bit branch); pull-only.
    container: ghcr.io/goldsrc-net/build-containers/debian10:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          # Fine-grained PAT / GitHub App token with Contents:Read on the private
          # goldsrc-net/vgui_support submodule (the default GITHUB_TOKEN is scoped to
          # this repo only and can't clone another private repo). Set the secret in
          # repo/org settings; used for the main checkout + recursive submodule auth.
          token: ${{ secrets.SUBMODULES_TOKEN }}

      - name: Configure (i386)
        run: |
          cmake -B build-i386 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cmake/LinuxToolchain.cmake

      - name: Build (hl gamedll + client)
        run: cmake --build build-i386 --target hl client -j$(nproc)

      - name: Stage per-arch
        run: |
          mkdir -p staged-i386/dlls staged-i386/cl_dlls
          cp build-i386/dlls/hl.so staged-i386/dlls/hl.so
          cp build-i386/cl_dll/client.so staged-i386/cl_dlls/client.so

      - name: Deploy
        uses: actions/upload-artifact@v4
        with:
          name: Linux-i386
          path: staged-i386/**

  # Linux amd64 — CMake. 64-bit static-links openvgui (submodule) + the vgui_support
  # shim, so the client has no vgui/SDL2 DT_NEEDED and exports InitVGUISupportAPI.
  linux-amd64:
    name: Linux-amd64
    runs-on: ubuntu-latest
    container: ghcr.io/goldsrc-net/build-containers/debian10:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          # Fine-grained PAT / GitHub App token with Contents:Read on the private
          # goldsrc-net/vgui_support submodule (the default GITHUB_TOKEN is scoped to
          # this repo only and can't clone another private repo). Set the secret in
          # repo/org settings; used for the main checkout + recursive submodule auth.
          token: ${{ secrets.SUBMODULES_TOKEN }}

      - name: Configure (amd64)
        run: cmake -B build-amd64 -DCMAKE_BUILD_TYPE=Release

      - name: Build (hl gamedll + client)
        run: cmake --build build-amd64 --target hl client -j$(nproc)

      - name: Stage per-arch
        run: |
          mkdir -p staged-amd64/dlls staged-amd64/cl_dlls
          cp build-amd64/dlls/hl.so staged-amd64/dlls/hl.so
          cp build-amd64/cl_dll/client.so staged-amd64/cl_dlls/client.so

      - name: Deploy
        uses: actions/upload-artifact@v4
        with:
          name: Linux-amd64
          path: staged-amd64/**

  # Linux aarch64 — CMake cross-compiled via the in-tree toolchain file.
  linux-aarch64:
    name: Linux-aarch64
    runs-on: ubuntu-latest
    container: ghcr.io/goldsrc-net/build-containers/debian10:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          # Fine-grained PAT / GitHub App token with Contents:Read on the private
          # goldsrc-net/vgui_support submodule (the default GITHUB_TOKEN is scoped to
          # this repo only and can't clone another private repo). Set the secret in
          # repo/org settings; used for the main checkout + recursive submodule auth.
          token: ${{ secrets.SUBMODULES_TOKEN }}

      - name: Configure (aarch64 cross)
        # The image ships a gcc-8.3 aarch64 cross-toolchain; point CC/CXX at it (matches
        # scripts/build.sh) so the toolchain file picks it over the image's default clang.
        env:
          CC: aarch64-linux-gnu-gcc
          CXX: aarch64-linux-gnu-g++
        run: |
          cmake -B build-aarch64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cmake/LinuxToolchain-aarch64.cmake

      - name: Build (hl gamedll + client)
        run: cmake --build build-aarch64 --target hl client -j$(nproc)

      - name: Stage per-arch
        run: |
          mkdir -p staged-aarch64/dlls staged-aarch64/cl_dlls
          cp build-aarch64/dlls/hl.so staged-aarch64/dlls/hl.so
          cp build-aarch64/cl_dll/client.so staged-aarch64/cl_dlls/client.so

      - name: Deploy
        uses: actions/upload-artifact@v4
        with:
          name: Linux-aarch64
          path: staged-aarch64/**

  # Win32 — CMake/MSVC. 32-bit keeps dynamic Valve vgui (utils/vgui/lib/win32_vc16/vgui.lib).
  win32:
    name: Win32
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          # Fine-grained PAT / GitHub App token with Contents:Read on the private
          # goldsrc-net/vgui_support submodule (the default GITHUB_TOKEN is scoped to
          # this repo only and can't clone another private repo). Set the secret in
          # repo/org settings; used for the main checkout + recursive submodule auth.
          token: ${{ secrets.SUBMODULES_TOKEN }}

      - name: Configure (Win32)
        run: cmake -B build-win32 -A Win32

      - name: Build (hl gamedll + client)
        run: cmake --build build-win32 --config Release --target hl client --parallel 2

      - name: Stage per-arch
        shell: bash
        run: |
          mkdir -p staged-win32/dlls staged-win32/cl_dlls
          cp build-win32/dlls/Release/hl.dll        staged-win32/dlls/hl.dll
          cp build-win32/cl_dll/Release/client.dll  staged-win32/cl_dlls/client.dll
          cp build-win32/dlls/Release/hl.pdb        staged-win32/dlls/       2>/dev/null || true
          cp build-win32/cl_dll/Release/client.pdb  staged-win32/cl_dlls/    2>/dev/null || true

      - name: Deploy
        uses: actions/upload-artifact@v4
        with:
          name: Win32
          path: staged-win32/**

  # Win64 — CMake/MSVC. 64-bit static-links openvgui (submodule, built as part of the
  # client via VGUI_STATIC) + the vgui_support shim: no vgui.dll companion to ship, and
  # the client exports InitVGUISupportAPI. Compile+link check (no native 64-bit GoldSrc
  # engine loads the result).
  win64:
    name: Win64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          # Fine-grained PAT / GitHub App token with Contents:Read on the private
          # goldsrc-net/vgui_support submodule (the default GITHUB_TOKEN is scoped to
          # this repo only and can't clone another private repo). Set the secret in
          # repo/org settings; used for the main checkout + recursive submodule auth.
          token: ${{ secrets.SUBMODULES_TOKEN }}

      - name: Configure (x64)
        run: cmake -B build-win64 -A x64

      - name: Build (hl gamedll + client)
        run: cmake --build build-win64 --config Release --target hl client --parallel 2

      - name: Stage per-arch
        shell: bash
        run: |
          mkdir -p staged-win64/dlls staged-win64/cl_dlls
          cp build-win64/dlls/Release/hl.dll        staged-win64/dlls/hl.dll
          cp build-win64/cl_dll/Release/client.dll  staged-win64/cl_dlls/client.dll
          cp build-win64/dlls/Release/hl.pdb        staged-win64/dlls/       2>/dev/null || true
          cp build-win64/cl_dll/Release/client.pdb  staged-win64/cl_dlls/    2>/dev/null || true

      - name: Deploy
        uses: actions/upload-artifact@v4
        with:
          name: Win64
          path: staged-win64/**

  # Package — fan in every build job into ONE combined artifact. Both game libraries
  # for every arch, laid out the way the engine expects: dlls/ (server) + cl_dlls/
  # (client). i386 keeps the plain name; every non-i386 build gets its arch suffixed
  # (xash convention: hl_amd64.so / hl_aarch64.so / hl_amd64.dll, likewise client_*).
  package:
    name: Package (all arches, one zip)
    runs-on: ubuntu-latest
    needs: [linux-i386, linux-amd64, linux-aarch64, win32, win64]
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble combined tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/dlls dist/cl_dlls
          # pick <artifact-dir> <filename> -> first matching file (robust to nesting)
          pick() {
            local f
            f=$(find "artifacts/$1" -type f -name "$2" | head -1)
            if [ -z "$f" ]; then echo "MISSING: $2 in artifact $1" >&2; exit 1; fi
            echo "$f"
          }
          # server libraries -> dlls/
          cp "$(pick Linux-i386     hl.so)"     dist/dlls/hl.so
          cp "$(pick Linux-amd64    hl.so)"     dist/dlls/hl_amd64.so
          cp "$(pick Linux-aarch64  hl.so)"     dist/dlls/hl_aarch64.so
          cp "$(pick Win32          hl.dll)"    dist/dlls/hl.dll
          cp "$(pick Win64          hl.dll)"    dist/dlls/hl_amd64.dll
          # client libraries -> cl_dlls/
          cp "$(pick Linux-i386     client.so)"  dist/cl_dlls/client.so
          cp "$(pick Linux-amd64    client.so)"  dist/cl_dlls/client_amd64.so
          cp "$(pick Linux-aarch64  client.so)"  dist/cl_dlls/client_aarch64.so
          cp "$(pick Win32          client.dll)" dist/cl_dlls/client.dll
          cp "$(pick Win64          client.dll)" dist/cl_dlls/client_amd64.dll
          echo "=== combined tree ==="
          find dist -type f | sort

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: ts-gamelibs-all
          path: dist/**
